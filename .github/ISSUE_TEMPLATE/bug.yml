name: Bug report
description: Something in the game behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include what was expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Firefox 130, Linux desktop
  - type: dropdown
    id: input
    attributes:
      label: Input method
      options: [Keyboard and mouse, Touch, Gamepad]
