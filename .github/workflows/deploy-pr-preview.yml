name: Deploy PR preview

# Each open PR gets a live preview at gh-pages/pr-<N>/, alongside the live
# site at the gh-pages root (deploy-pages.yml). Both use the same gh-pages
# branch mechanism, with race-safe pushes from
# .github/scripts/publish-gh-pages.sh.
#
# Fork PRs are skipped: their tokens are read-only and cannot push.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build at PR-specific base path
        run: npx vite build --base=/FunBunRun/pr-${PR_NUMBER}/
      - name: Publish preview
        run: |
          .github/scripts/publish-gh-pages.sh publish dist "pr-${PR_NUMBER}" "chore: deploy preview for PR #${PR_NUMBER}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-preview
          message: |
            **Preview deployed:** https://theraccoonbear.github.io/FunBunRun/pr-${{ github.event.pull_request.number }}/

            Updates automatically on every push to this PR.

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Checkout supplies the publish script from the default branch; the
      # script does nothing if gh-pages or this PR's directory does not exist.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Remove preview
        run: |
          .github/scripts/publish-gh-pages.sh remove "pr-${PR_NUMBER}" "chore: remove preview for closed PR #${PR_NUMBER}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-preview
          message: Preview removed (PR closed).
