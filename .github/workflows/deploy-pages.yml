name: Deploy Pages

# Publishes the production build to the root of the gh-pages branch.
# PR previews (deploy-pr-preview.yml) live in gh-pages/pr-<N>/ and are
# preserved on root publishes. Repo Settings -> Pages -> Source must be
# "Deploy from a branch" (gh-pages, /root), not "GitHub Actions".
#
# The deploy runs only after CI (ci.yml) has completed successfully on a push
# to main, so a red main is never published. This is also why PR branches do
# not need to be up to date with main before merging: the merged result is
# tested by CI on main, and production only follows when that run is green.
# If a newer commit has landed on main by the time this runs, the deploy is
# skipped (.github/scripts/is-main-tip.sh); the newer commit's own CI and
# deploy follow. Note that workflow_run triggers only take effect from the
# default branch.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# Deploys are never cancelled; they queue in a single group so the newest
# main commit is the one that ends up published. Concurrent pushes to
# gh-pages from other workflows are handled by the retried push in
# .github/scripts/publish-gh-pages.sh.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Skip if a newer commit is on main
        id: guard
        if: github.event_name != 'workflow_dispatch'
        run: .github/scripts/is-main-tip.sh "$DEPLOY_SHA"
      - if: steps.guard.outputs.publish != 'false'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.guard.outputs.publish != 'false'
        run: npm ci
      - if: steps.guard.outputs.publish != 'false'
        run: npm run build
      - name: Publish to gh-pages root
        if: steps.guard.outputs.publish != 'false'
        run: |
          .github/scripts/publish-gh-pages.sh publish dist . "deploy: ${DEPLOY_SHA}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
