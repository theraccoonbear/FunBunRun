<!DOCTYPE html>
<html lang="en">
<head>

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#87c5ea;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
canvas{display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.55);z-index:5}
#top{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:center;gap:18px;font-weight:800;font-size:18px}
#stam{position:absolute;top:40px;left:50%;transform:translateX(-50%);width:160px;height:8px;background:rgba(0,0,0,.35);border-radius:4px;overflow:hidden}
#stamFill{height:100%;width:100%;background:#ffd34d}
#arrowWrap{position:absolute;top:58px;left:50%;width:40px;height:40px;margin-left:-20px;display:none}

.btn{position:fixed;z-index:4;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.55);color:#fff;font-weight:900;display:none;align-items:center;justify-content:center;text-shadow:0 1px 2px rgba(0,0,0,.6);touch-action:none}
#bLick{right:24px;bottom:40px;width:96px;height:96px;font-size:20px;background:rgba(255,95,200,.45)}
#bLick.hot{background:rgba(255,95,200,.85);box-shadow:0 0 18px #ff5fc8}

<body>
<div id="hud">
  <div id="top"><span id="tTime">1:30</span><span id="tScore">Score 0</span><span id="tLicks">Licks 0</span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== RAGDOLL SIM (pure JS, no THREE) =====
// Verlet particles + distance constraints. The person and the leash share one solver.
function makeRagdollSim(opts) {
  const G = 18;
  const pts = [];
  const cons = [];
  function P(name, x, y, z, r, im) {
    const p = { name: name, x: x, y: y, z: z, px: x, py: y, pz: z, r: r, im: im };
    pts.push(p);
    return p;
  }
  function C(a, b, stiff) {
    cons.push({ a: a, b: b, len: Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z), s: stiff });
  }
  const ox = opts.x, oz = opts.z;
  const body = {
    head: P("head", ox, 1.62, oz, 0.16, 1),
    neck: P("neck", ox, 1.4, oz, 0.12, 1),
    pelvis: P("pelvis", ox, 0.95, oz, 0.14, 1),
    lElbow: P("lElbow", ox - 0.32, 1.15, oz, 0.07, 1),
    lHand: P("lHand", ox - 0.36, 0.9, oz, 0.06, 1),
    rElbow: P("rElbow", ox + 0.32, 1.15, oz, 0.07, 1),
    rHand: P("rHand", ox + 0.36, 0.9, oz - 0.05, 0.06, 1),
    lKnee: P("lKnee", ox - 0.12, 0.5, oz, 0.08, 1),
    lFoot: P("lFoot", ox - 0.12, 0.08, oz, 0.08, 1),
    rKnee: P("rKnee", ox + 0.12, 0.5, oz, 0.08, 1),
    rFoot: P("rFoot", ox + 0.12, 0.08, oz, 0.08, 1)
  };
  const b = body;
  C(b.head, b.neck, 1); C(b.neck, b.pelvis, 1); C(b.head, b.pelvis, 0.6);
  C(b.neck, b.lElbow, 1); C(b.lElbow, b.lHand, 1);
  C(b.neck, b.rElbow, 1); C(b.rElbow, b.rHand, 1);
  C(b.pelvis, b.lKnee, 1); C(b.lKnee, b.lFoot, 1);
  C(b.pelvis, b.rKnee, 1); C(b.rKnee, b.rFoot, 1);
  C(b.lKnee, b.rKnee, 0.3); C(b.lElbow, b.rElbow, 0.15);
  const bodyPts = pts.slice();

  // Leash rope: rope[0] pinned to the dog collar, last point is the person's right hand
  const L = opts.leash, N = 10;
  const rope = [];
  const c0 = opts.collar;
  for (let i = 0; i <= N; i++) {
    if (i === N) {
      rope.push(b.rHand);
      break;
    }
    const t = i / N;
    rope.push(P("rope" + i, c0.x + (b.rHand.x - c0.x) * t, c0.y + (b.rHand.y - c0.y) * t, c0.z + (b.rHand.z - c0.z) * t, 0.03, i === 0 ? 0 : 0.6));
  }
  const ropeCons = [];
  for (let i = 0; i < N; i++) {
    ropeCons.push({ a: rope[i], b: rope[i + 1], len: L / N, s: 1, rope: true });
  }

  const st = { stun: -5, tension: 0, yank: 0, walkPh: 0, dragged: 0 };

  function solve(c) {
    const a = c.a, bb = c.b;
    const dx = bb.x - a.x, dy = bb.y - a.y, dz = bb.z - a.z;
    const d = Math.hypot(dx, dy, dz) || 1e-6;
    if (c.rope && d < c.len) {
      return; // ropes only pull
    }
    const w = a.im + bb.im;
    if (w === 0) {
      return;
    }
    const diff = (d - c.len) / d * c.s;
    a.x += dx * diff * a.im / w; a.y += dy * diff * a.im / w; a.z += dz * diff * a.im / w;
    bb.x -= dx * diff * bb.im / w; bb.y -= dy * diff * bb.im / w; bb.z -= dz * diff * bb.im / w;
  }
  function shiftBody(dx, dz) {
    for (const p of bodyPts) {
      p.x += dx; p.px += dx; p.z += dz; p.pz += dz;
    }
  }

  function step(h, collar, collide) {
    rope[0].x = rope[0].px = collar.x;
    rope[0].y = rope[0].py = collar.y;
    rope[0].z = rope[0].pz = collar.z;
    const pelX0 = b.pelvis.x, pelZ0 = b.pelvis.z;

    // Integrate
    for (const p of pts) {
      if (p.im === 0) {
        continue;
      }
      let vx = (p.x - p.px) * 0.995, vy = (p.y - p.py) * 0.995, vz = (p.z - p.pz) * 0.995;
      if (p.y <= p.r + 0.02) {
        vx *= 0.86; vz *= 0.86;
      }
      p.px = p.x; p.py = p.y; p.pz = p.z;
      p.x += vx; p.y += vy - G * h * h; p.z += vz;
    }

    // The person tries to get up and follow the dog: blend toward a standing pose,
    // ramping in after each yank so they visibly scramble back to their feet.
    st.stun -= h;
    st.yank -= h;
    const standing = b.head.y > 1.3 && b.pelvis.y > 0.75;
    const rec = Math.max(0, Math.min(1, -st.stun / 1.2));
    if (rec > 0) {
      const Fx = (b.lFoot.x + b.rFoot.x) / 2, Fz = (b.lFoot.z + b.rFoot.z) / 2;
      let fx = collar.x - Fx, fz = collar.z - Fz;
      const fd = Math.hypot(fx, fz) || 1;
      fx /= fd; fz /= fd;
      const rx = -fz, rz = fx;
      let swing = 0;
      if (standing && fd > L * 0.7) {
        const sp = 3.2 * h * rec;
        shiftBody(fx * sp, fz * sp);
        st.walkPh += h * 10;
        swing = Math.sin(st.walkPh);
      } else {
        swing *= 0.9;
      }
      const T = (x, y, z) => [x, y, z];
      const pose = [
        [b.lFoot, T(Fx - rx * 0.12 + fx * swing * 0.25, 0.08, Fz - rz * 0.12 + fz * swing * 0.25)],
        [b.rFoot, T(Fx + rx * 0.12 - fx * swing * 0.25, 0.08, Fz + rz * 0.12 - fz * swing * 0.25)],
        [b.lKnee, T(Fx - rx * 0.12 + fx * (0.06 + swing * 0.12), 0.5, Fz - rz * 0.12 + fz * (0.06 + swing * 0.12))],
        [b.rKnee, T(Fx + rx * 0.12 + fx * (0.06 - swing * 0.12), 0.5, Fz + rz * 0.12 + fz * (0.06 - swing * 0.12))],
        [b.pelvis, T(Fx, 0.95, Fz)],
        [b.neck, T(Fx + fx * 0.06, 1.4, Fz + fz * 0.06)],
        [b.head, T(Fx + fx * 0.08, 1.62, Fz + fz * 0.08)],
        [b.rElbow, T(Fx + rx * 0.25 + fx * 0.22, 1.2, Fz + rz * 0.25 + fz * 0.22)],
        [b.rHand, T(Fx + rx * 0.2 + fx * 0.5, 1.15, Fz + rz * 0.2 + fz * 0.5)],
        [b.lElbow, T(Fx - rx * 0.3 - fx * swing * 0.1, 1.15, Fz - rz * 0.3 - fz * swing * 0.1)],
        [b.lHand, T(Fx - rx * 0.34 - fx * swing * 0.25, 0.9, Fz - rz * 0.34 - fz * swing * 0.25)]
      ];
      const s = 0.15 * rec, damp = 1 - 0.5 * rec;
      for (const [p, t] of pose) {
        const vx = (p.x - p.px) * damp, vy = (p.y - p.py) * damp, vz = (p.z - p.pz) * damp;
        p.x += (t[0] - p.x) * s; p.y += (t[1] - p.y) * s; p.z += (t[2] - p.z) * s;
        p.px = p.x - vx; p.py = p.y - vy; p.pz = p.z - vz;
      }
    }

    // Constraints
    let pull = 0;
    for (let it = 0; it < 10; it++) {
      for (const c of cons) {
        solve(c);
      }
      for (const c of ropeCons) {
        solve(c);
      }
      // Hard leash limit: the dog always wins
      const hx = b.rHand.x - collar.x, hy = b.rHand.y - collar.y, hz = b.rHand.z - collar.z;
      const hd = Math.hypot(hx, hy, hz);
      if (hd > L) {
        const k = L / hd;
        const nx = collar.x + hx * k, ny = collar.y + hy * k, nz = collar.z + hz * k;
        pull += hd - L;
        b.rHand.x = nx; b.rHand.y = ny; b.rHand.z = nz;
      }
      for (const p of pts) {
        if (p.y < p.r) {
          p.y = p.r;
        }
      }
    }
    for (const p of bodyPts) {
      collide(p);
    }

    st.tension = Math.min(1, pull * 20);
    // Only a moving dog knocks the human over; slack-taking while they get up does not
    const cs = st.lc ? Math.hypot(collar.x - st.lc.x, collar.z - st.lc.z) / h : 0;
    st.lc = { x: collar.x, z: collar.z };
    if (pull > 0.004 && cs > 3.5) {
      st.stun = Math.max(st.stun, 0.9);
    }
    if (pull > 0.03 && cs > 3.5 && standing && st.yank <= 0) {
      st.yank = 2.5;
      st.yanked = true;
    }
    if (b.head.y < 0.8) {
      st.dragged += Math.hypot(b.pelvis.x - pelX0, b.pelvis.z - pelZ0);
    }
  }

  return { pts: pts, body: body, rope: rope, st: st, step: step, L: L };
}
// ===== END RAGDOLL SIM =====
</script>
<script>
(function () {
"use strict";
const isTouch = window.matchMedia("(pointer:coarse)").matches || ("ontouchstart" in window);
const B = 98;            // play area half-size
const ROUND = 90;        // seconds per round
const LEASH = 3.6;
const $ = (id) => document.getElementById(id);

// ---------- Renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(innerWidth, innerHeight);
document.body.insertBefore(renderer.domElement, document.body.firstChild);
const canvas = renderer.domElement;

const scene = new THREE.Scene();
const SKY = new THREE.Color(0x87c5ea), SNIFFC = new THREE.Color(0x5a3d78);
scene.background = SKY.clone();
scene.fog = new THREE.Fog(SKY.clone(), 30, 120);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 300);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a7a3a, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(30, 60, 20);
scene.add(sun);

(function () {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#6fbf4f";
  g.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 700; i++) {
    const s = Math.random();
    g.fillStyle = s < 0.5 ? "#62b043" : s < 0.95 ? "#7dcc5c" : (Math.random() < 0.5 ? "#fff7a8" : "#ffc2e2");
    g.fillRect(Math.random() * 128, Math.random() * 128, 2, 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(50, 50);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshLambertMaterial({ map: tex }));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
  const m = new THREE.MeshLambertMaterial({ color: 0xc9a27a });
  const geo = new THREE.BoxGeometry(2 * B + 2, 1.2, 0.4);
  for (const [x, z, r] of [[0, -B - 0.7, 0], [0, B + 0.7, 0], [-B - 0.7, 0, Math.PI / 2], [B + 0.7, 0, Math.PI / 2]]) {
    const f = new THREE.Mesh(geo, m);
    f.position.set(x, 0.6, z);
    f.rotation.y = r;
    scene.add(f);
  }
})();

function blobShadow(parent, r) {
  const s = new THREE.Mesh(new THREE.CircleGeometry(r, 16),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, depthWrite: false }));
  s.rotation.x = -Math.PI / 2;
  s.position.y = 0.02;
  parent.add(s);
  return s;
}

// ---------- Obstacles ----------
const obs = [];
function closest(o, x, z) {
  const vx = o.bx - o.ax, vz = o.bz - o.az;
  const l2 = vx * vx + vz * vz;
  let t = l2 > 0 ? ((x - o.ax) * vx + (z - o.az) * vz) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return [o.ax + vx * t, o.az + vz * t];
}
function freeSpot(minR) {
  for (let i = 0; i < 300; i++) {
    const x = (Math.random() * 2 - 1) * (B - 4), z = (Math.random() * 2 - 1) * (B - 4);
    if (Math.hypot(x, z) < 14) {
      continue;
    }
    let ok = true;
    for (const o of obs) {
      const [cx, cz] = closest(o, x, z);
      if (Math.hypot(x - cx, z - cz) < o.r + minR) {
        ok = false;
        break;
      }
    }
    if (ok) {
      return [x, z];
    }
  }
  return [0, 40];
}
function addCircle(x, z, r, h) {
  obs.push({ ax: x, az: z, bx: x, bz: z, r: r, h: h });
}
const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 2.2, 7);
const leafGeo = new THREE.ConeGeometry(1.9, 4.2, 8);
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x7a5233 });
const leafMats = [0x2f8a3c, 0x3d9e48, 0x267a35].map((c) => new THREE.MeshLambertMaterial({ color: c }));
for (let i = 0; i < 70; i++) {
  const [x, z] = freeSpot(3);
  const t = new THREE.Mesh(trunkGeo, trunkMat);
  t.position.set(x, 1.1, z);
  const l = new THREE.Mesh(leafGeo, leafMats[i % 3]);
  l.position.set(x, 4, z);
  l.scale.setScalar(0.8 + Math.random() * 0.6);
  scene.add(t, l);
  addCircle(x, z, 0.5, 99);
}
const bushGeo = new THREE.SphereGeometry(1.2, 10, 8);
const bushMat = new THREE.MeshLambertMaterial({ color: 0x4caf50 });
for (let i = 0; i < 40; i++) {
  const [x, z] = freeSpot(2.5);
  const b = new THREE.Mesh(bushGeo, bushMat);
  b.position.set(x, 0.6, z);
  b.scale.set(1, 0.8, 1);
  scene.add(b);
  addCircle(x, z, 1.15, 1.6);
}
const rockGeo = new THREE.DodecahedronGeometry(1, 0);
const rockMat = new THREE.MeshLambertMaterial({ color: 0x9a9a9a });
for (let i = 0; i < 20; i++) {
  const [x, z] = freeSpot(2.5);
  const r = new THREE.Mesh(rockGeo, rockMat);
  r.position.set(x, 0.5, z);
  r.rotation.set(Math.random() * 3, Math.random() * 3, 0);
  scene.add(r);
  addCircle(x, z, 1.0, 1.4);
}
const logGeo = new THREE.CylinderGeometry(0.35, 0.35, 4, 8);
const logMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
for (let i = 0; i < 18; i++) {
  const [x, z] = freeSpot(3);
  const a = Math.random() * Math.PI;
  const lg = new THREE.Mesh(logGeo, logMat);
  lg.position.set(x, 0.35, z);
  lg.rotation.set(0, a, Math.PI / 2);
  scene.add(lg);
  const dx = Math.cos(a) * 2, dz = -Math.sin(a) * 2;
  obs.push({ ax: x - dx, az: z - dz, bx: x + dx, bz: z + dz, r: 0.35, h: 0.7 });
}
function collide(p, rad, minH) {
  for (const o of obs) {
    if (o.h < minH || p.y >= o.h) {
      continue;
    }
    const [cx, cz] = closest(o, p.x, p.z);
    let dx = p.x - cx, dz = p.z - cz;
    const d = Math.hypot(dx, dz), md = o.r + rad;
    if (d < md) {
      if (d < 1e-4) {
        dx = 1;
        dz = 0;
      } else {
        dx /= d;
        dz /= d;
      }
      p.x = cx + dx * md;
      p.z = cz + dz * md;
    }
  }
  p.x = Math.max(-B, Math.min(B, p.x));
  p.z = Math.max(-B, Math.min(B, p.z));
}

// ---------- The Bun ----------
function makeBunny() {
  const outer = new THREE.Group(), inner = new THREE.Group();
  outer.add(inner);
  const fur = new THREE.MeshLambertMaterial({ color: 0xf3ece2 });
  const pink = new THREE.MeshLambertMaterial({ color: 0xffa6c9 });
  const dark = new THREE.MeshBasicMaterial({ color: 0x222222 });
  const sph = (r, m, x, y, z, sx, sy, sz) => {
    const s = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 10), m);
    s.position.set(x, y, z);
    s.scale.set(sx || 1, sy || 1, sz || 1);
    inner.add(s);
    return s;
  };
  sph(0.35, fur, 0, 0.35, 0, 1, 0.9, 1.3);
  sph(0.24, fur, 0, 0.62, 0.38);
  sph(0.12, fur, 0, 0.42, -0.47);
  sph(0.04, dark, 0.12, 0.68, 0.57);
  sph(0.04, dark, -0.12, 0.68, 0.57);
  sph(0.045, pink, 0, 0.61, 0.62);
  const ears = [];
  for (const sx of [-1, 1]) {
    const ear = new THREE.Group();
    ear.position.set(0.1 * sx, 0.8, 0.32);
    const e = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), fur);
    e.scale.set(0.08, 0.32, 0.05);
    e.position.y = 0.26;
    const inn = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), pink);
    inn.scale.set(0.05, 0.25, 0.03);
    inn.position.set(0, 0.26, 0.025);

function tone(type, f0, f1, dur, vol) {
  if (!ac) {

  }
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  f.type = "lowpass";

  g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f);
  f.connect(g);
  g.connect(ac.destination);
  o.start(t);
  o.stop(t + dur + 0.02);
}

// Touch: left half = floating joystick, right half = orbit camera. Pointer capture keeps each finger bound.
const touchLayer = $("touch"), joyBase = $("joyBase"), joyKnob = $("joyKnob");
const JOY_R = 50;
let joyId = null, joyO = { x: 0, y: 0 }, lookId = null, lookLast = { x: 0, y: 0 };
touchLayer.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  try { touchLayer.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  if (e.clientX < innerWidth * 0.5 && joyId === null) {
    joyId = e.pointerId;
    joyO = { x: e.clientX, y: e.clientY };
    joyBase.style.left = (e.clientX - 60) + "px";
    joyBase.style.top = (e.clientY - 60) + "px";
    joyBase.style.display = "block";
    joyKnob.style.transform = "translate(0,0)";
  } else if (lookId === null) {
    lookId = e.pointerId;
    lookLast = { x: e.clientX, y: e.clientY };
  }
});
touchLayer.addEventListener("pointermove", (e) => {
  e.preventDefault();
  if (e.pointerId === joyId) {
    let dx = e.clientX - joyO.x, dy = e.clientY - joyO.y;
    const d = Math.hypot(dx, dy);
    // Joystick base follows the finger if it drifts far, so you never run out of stick
    if (d > JOY_R * 1.6) {
      const k = (d - JOY_R * 1.6) / d;
      joyO.x += dx * k;
      joyO.y += dy * k;
      joyBase.style.left = (joyO.x - 60) + "px";
      joyBase.style.top = (joyO.y - 60) + "px";
      dx = e.clientX - joyO.x;
      dy = e.clientY - joyO.y;
    }
    const dd = Math.hypot(dx, dy);
    const cl = Math.min(1, dd / JOY_R);
    const nx = dd > 0 ? dx / dd : 0, ny = dd > 0 ? dy / dd : 0;
    const mag = cl < 0.12 ? 0 : (cl - 0.12) / 0.88;
    touchMove.x = nx * mag;
    touchMove.y = -ny * mag;
    touchSprint = dd > JOY_R * 1.15;
    joyKnob.className = touchSprint ? "sprint" : "";
    joyKnob.style.transform = "translate(" + (nx * Math.min(dd, JOY_R)) + "px," + (ny * Math.min(dd, JOY_R)) + "px)";
  } else if (e.pointerId === lookId) {
    inp.lookX += (e.clientX - lookLast.x) * 1.3;
    inp.lookY += (e.clientY - lookLast.y) * 1.3;
    lookLast = { x: e.clientX, y: e.clientY };
  }
});
function touchEnd(e) {
  if (e.pointerId === joyId) {
    joyId = null;
    touchMove.x = touchMove.y = 0;
    touchSprint = false;
    joyBase.style.display = "none";
  }
  if (e.pointerId === lookId) {
    lookId = null;
  }
}
touchLayer.addEventListener("pointerup", touchEnd);

const padPrev = {};
function pollPad(dt) {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const gp of pads) {
    if (!gp) {
      continue;
    }
    const dz = (v) => (Math.abs(v) < 0.15 ? 0 : v);
    inp.mx += dz(gp.axes[0] || 0);
    inp.my -= dz(gp.axes[1] || 0);
    inp.lookX += dz(gp.axes[2] || 0) * 700 * dt;
    inp.lookY += dz(gp.axes[3] || 0) * 500 * dt;
    const pressed = (i) => !!(gp.buttons[i] && gp.buttons[i].pressed);
    const edge = (i) => {
      const k = gp.index + ":" + i, p = pressed(i), was = padPrev[k];
      padPrev[k] = p;
      return p && !was;
    };
    if (edge(0)) {
      if (state === "play") {
        inp.jumpQ = true;
      } else {
        startGame();
      }
    }
    if (edge(2) || edge(7)) {
      inp.lickQ = true;
    }
    if (edge(9) && state !== "play") {
      startGame();
    }
    if (pressed(1) || pressed(6)) {
      inp.sniff = true;
    }
    if (pressed(4) || pressed(10)) {
      inp.sprint = true;
    }
  }
}

// ---------- Update ----------
function wrapAngle(a) {
  while (a > Math.PI) {
    a -= 2 * Math.PI;
  }
  while (a < -Math.PI) {
    a += 2 * Math.PI;
  }
  return a;
}
function placeDog() {
  dog.root.position.copy(D.pos);
  dog.root.rotation.y = D.h;
}

function updateDog(dt) {
  camYaw -= inp.lookX * 0.004;
  camPitch += inp.lookY * 0.003;
  if (keys.ArrowLeft) {
    camYaw += 2.4 * dt;
  }
  if (keys.ArrowRight) {
    camYaw -= 2.4 * dt;
  }
  camPitch = Math.max(0.08, Math.min(1.1, camPitch));
  lookIdle = (inp.lookX || inp.lookY) ? 0 : lookIdle + dt;

  let mx = inp.mx, my = inp.my;
  const len = Math.hypot(mx, my);
  if (len > 1) {
    mx /= len;
    my /= len;
  }
  const mag = Math.min(1, len);
  const moving = mag > 0.05;
  const sprinting = inp.sprint && moving && D.stam > 0.02;
  if (sprinting) {
    D.stam = Math.max(0, D.stam - dt * 0.26);
  } else {
    D.stam = Math.min(1, D.stam + dt * (moving ? 0.12 : 0.22));
  }
  const tension = rag ? rag.st.tension : 0;
  const speed = (sprinting ? 11 : 6.8) * mag * (1 - 0.12 * tension);
  const fx = -Math.sin(camYaw), fz = -Math.cos(camYaw);
  const rx = Math.cos(camYaw), rz = -Math.sin(camYaw);
  const tx = (fx * my + rx * mx) * speed, tz = (fz * my + rz * mx) * speed;
  const k = 1 - Math.exp(-(D.grounded ? 9 : 2.5) * dt);
  D.vel.x += (tx - D.vel.x) * k;
  D.vel.z += (tz - D.vel.z) * k;
  D.lunge = Math.max(0, D.lunge - dt);
  D.pos.x += D.vel.x * dt;
  D.pos.z += D.vel.z * dt;
  if (inp.jumpQ && D.grounded) {
    D.vy = 7.5;
    D.grounded = false;
    sfx.jump();
  }
  D.vy -= 22 * dt;
  D.pos.y += D.vy * dt;
  if (D.pos.y <= 0) {
    D.pos.y = 0;
    D.vy = 0;
    D.grounded = true;
  }
  collide(D.pos, 0.45, 0);

  const hs = Math.hypot(D.vel.x, D.vel.z);
  if (hs > 0.4) {
    const target = Math.atan2(D.vel.x, D.vel.z);
    D.h = wrapAngle(D.h + wrapAngle(target - D.h) * Math.min(1, dt * 12));
  }
  // Camera drifts back behind the dog when you are running and not steering it
  if (moving && lookIdle > 1.0) {
    camYaw += wrapAngle(D.h + Math.PI - camYaw) * Math.min(1, dt * 1.2);
  }

  // Animate: gallop
  const amp = Math.min(1, hs / 6.8);
  D.ph += dt * (3 + hs * 1.7);
  dog.root.position.copy(D.pos);
  dog.root.rotation.y = D.h;
  dog.body.position.y = 0.55 + Math.abs(Math.sin(D.ph)) * 0.12 * amp;
  dog.body.rotation.x = Math.sin(D.ph) * 0.13 * amp;
  if (!D.grounded) {
    dog.legs[0].rotation.x = dog.legs[1].rotation.x = -0.9;
    dog.legs[2].rotation.x = dog.legs[3].rotation.x = 0.9;
  } else {
    dog.legs[0].rotation.x = Math.sin(D.ph) * 0.9 * amp;
    dog.legs[1].rotation.x = Math.sin(D.ph + 0.4) * 0.9 * amp;
    dog.legs[2].rotation.x = Math.sin(D.ph + 2.4) * 0.9 * amp;
    dog.legs[3].rotation.x = Math.sin(D.ph + 2.8) * 0.9 * amp;
  }
  dog.tail.rotation.y = Math.sin(elapsed * 14) * 0.6;
  dog.ears[0].rotation.x = dog.ears[1].rotation.x = -Math.abs(Math.sin(D.ph)) * 0.6 * amp - (D.grounded ? 0 : 0.8);
  const ext = lickT > 0 ? Math.sin((1 - lickT / 0.35) * Math.PI) : 0;
  dog.head.position.z = 0.52 + ext * 0.12;
  dog.head.rotation.x = ext * 0.25;
  dog.tonguePivot.scale.set(1, 1, 1 + ext * 3);

  // Camera
  const tgt = tmpV.set(D.pos.x, D.pos.y + 0.9, D.pos.z);
  const dist = 7.5;
  camera.position.set(
    tgt.x - fx * Math.cos(camPitch) * dist,
    tgt.y + Math.sin(camPitch) * dist,
    tgt.z - fz * Math.cos(camPitch) * dist
  );
  camera.lookAt(tgt);
  const fovT = sprinting ? 72 : 65;
  camera.fov += (fovT - camera.fov) * Math.min(1, dt * 5);
  camera.updateProjectionMatrix();
  return { fx, fz, rx, rz, sprinting };
}

function updateBun(dt) {
  const b = bun;
  const dx = b.pos.x - D.pos.x, dz = b.pos.z - D.pos.z;
  const dist = Math.hypot(dx, dz) || 0.001;
  b.inv -= dt;
  b.jinkT -= dt;
  b.jinkCD -= dt;
  if (b.tired > 0) {
    b.tired -= dt;
    if (b.tired <= 0) {
      b.stam = 0.6;
    }
  }
  let wx, wz, spd;
  if (dist < 22) {
    wx = dx / dist;
    wz = dz / dist;
    if (dist < 6 && b.jinkCD <= 0) {
      b.jinkAng = (Math.random() < 0.5 ? -1 : 1) * (0.7 + Math.random() * 0.9);
      b.jinkT = 0.5;
      b.jinkCD = 0.9 + Math.random() * 1.3;
    }
    if (b.jinkT > 0) {
      const c = Math.cos(b.jinkAng), s = Math.sin(b.jinkAng);
      const nx = wx * c - wz * s, nz = wx * s + wz * c;
      wx = nx;
      wz = nz;
    }
    if (b.tired > 0) {
      spd = 4.2;
    } else {
      spd = 9.0;
      b.stam -= dt * 0.11;
      if (b.stam <= 0) {
        b.stam = 0;
        b.tired = 2.8;
      }
    }
  } else {
    b.wander += (Math.random() - 0.5) * dt * 3;
    wx = Math.sin(b.wander);
    wz = Math.cos(b.wander);
    spd = 2.2;
    b.stam = Math.min(1, b.stam + dt * 0.2);
  }
  for (const o of obs) {
    if (o.h < 0.8) {
      continue;
    }
    const [cx, cz] = closest(o, b.pos.x, b.pos.z);
    const ox = b.pos.x - cx, oz = b.pos.z - cz, d = Math.hypot(ox, oz);
    const reach = o.r + 2.5;
    if (d < reach && d > 1e-4) {
      const w = (reach - d) / 2.5 * 2;
      wx += ox / d * w;
      wz += oz / d * w;
    }
  }
  const m = B - 7;
  if (b.pos.x > m) { wx -= (b.pos.x - m) / 2.5; }
  if (b.pos.x < -m) { wx += (-m - b.pos.x) / 2.5; }
  if (b.pos.z > m) { wz -= (b.pos.z - m) / 2.5; }
  if (b.pos.z < -m) { wz += (-m - b.pos.z) / 2.5; }

  const target = Math.atan2(wx, wz);
  const diff = wrapAngle(target - b.h), tr = (b.jinkT > 0 ? 14 : 6) * dt;
  b.h = wrapAngle(b.h + Math.max(-tr, Math.min(tr, diff)));
  b.spd += (spd - b.spd) * Math.min(1, dt * 4);
  b.pos.x += Math.sin(b.h) * b.spd * dt;
  b.pos.z += Math.cos(b.h) * b.spd * dt;
  collide(b.pos, 0.35, 0.8);

  b.hopT += dt * (3 + b.spd * 1.1);
  b.bvy -= 22 * dt;
  b.by = Math.max(0, b.by + b.bvy * dt);
  if (b.by === 0) {
    b.bvy = 0;
  }
  const hy = Math.abs(Math.sin(b.hopT)) * (0.08 + b.spd * 0.04) + b.by;
  bunMesh.outer.position.set(b.pos.x, 0, b.pos.z);
  bunMesh.outer.rotation.y = b.h;
  bunMesh.inner.position.y = hy;
  bunMesh.inner.rotation.x = -Math.cos(b.hopT) * 0.15 * Math.min(1, b.spd / 5);
  const earFlop = b.tired > 0 ? 0.9 : 0.15 + Math.sin(b.hopT) * 0.15;
  bunMesh.ears[0].rotation.x = bunMesh.ears[1].rotation.x = -earFlop;

  trailTimer -= dt;
  if (trailTimer <= 0) {
    trailTimer = 0.25;
    const t = trail[trailIdx];
    trailIdx = (trailIdx + 1) % trail.length;
    t.mesh.position.set(b.pos.x, 0.2, b.pos.z);
    t.age = 0;
  }
  return dist;
}

function lickReach() {
  const dx = bun.pos.x - D.pos.x, dz = bun.pos.z - D.pos.z, d = Math.hypot(dx, dz);
  return { d: d, dx: dx, dz: dz, ok: d < 2.6 && D.pos.y < 1.3 && bun.inv <= 0 };
}

const hudCache = {};
function setText(id, t) {
  if (hudCache[id] !== t) {
    hudCache[id] = t;
    $(id).textContent = t;
  }
}

const PHYS_H = 1 / 60;
let physAcc = 0;
const ragCollide = (p) => collide(p, p.r, 0);

const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta());
  elapsed += dt;

  inp.mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + touchMove.x;
  inp.my = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) + touchMove.y;
  inp.sprint = !!(keys.ShiftLeft || keys.ShiftRight) || touchSprint;
  inp.sniff = !!keys.KeyQ || touchSniff;
  pollPad(dt);

  if (state === "play") {
    const f = updateDog(dt);
    updateBun(dt);
    const reach = lickReach();
    $("hint").className = reach.ok ? "on" : "";
    $("bLick").classList.toggle("hot", reach.ok);

    lickCD -= dt;
    if (inp.lickQ && lickCD <= 0) {
      lickT = 0.35;
      lickCD = 0.45;
      if (reach.ok) {
        // Auto-aim: snap the dog's face to the bun
        D.h = Math.atan2(reach.dx, reach.dz);
        combo = elapsed - lastLick < 8 ? combo + 1 : 1;
        lastLick = elapsed;
        const pts = 100 * combo;
        score += pts;
        licks++;
        pop("LICK! +" + pts + (combo > 1 ? "  x" + combo : ""), "#ff8fd6");
        sfx.slurp();
        burstHearts(bun.pos);
        bun.inv = 1.2;
        bun.stam = 1;
        bun.tired = 0;
        bun.bvy = 6;
        bun.jinkT = 0;
        bun.jinkCD = 0;
      } else {
        sfx.miss();
      }
    }

    // Ragdoll physics at a fixed 60 Hz
    dog.root.updateMatrixWorld(true);
    dog.collarPt.getWorldPosition(collarW);
    physAcc += dt;
    let n = 0;
    while (physAcc >= PHYS_H && n < 4) {
      rag.step(PHYS_H, collarW, ragCollide);
      physAcc -= PHYS_H;
      n++;
    }
    if (n === 4) {
      physAcc = 0;
    }
    if (rag.st.yanked) {
      rag.st.yanked = false;
      pop(["Yoink!", "Whoa!", "Not again!", "Slow down!"][Math.floor(Math.random() * 4)], "#bfe3ff");
      sfx.oof();
    }
    renderPerson();

    for (const b of bones) {
      b.rotation.y += dt * 2;
      b.position.y = 0.6 + Math.sin(elapsed * 3 + b.position.x) * 0.1;
      if (Math.hypot(b.position.x - D.pos.x, b.position.z - D.pos.z) < 1.4 && D.pos.y < 1.3) {
        D.stam = 1;
        score += 25;
        pop("Bone! +25", "#ffd34d");
        sfx.bone();
        placeBone(b);
      }
    }

    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0;
      if (score > best) {
        best = score;
        try { localStorage.setItem("funbunrun-best", String(best)); } catch (e) { /* ignore */ }
      }
      showMenu(true);
    }

    const sn = inp.sniff;
    scene.background.lerp(sn ? SNIFFC : SKY, Math.min(1, dt * 6));
    scene.fog.color.copy(scene.background);
    scene.fog.far += ((sn ? 70 : 120) - scene.fog.far) * Math.min(1, dt * 6);
    for (let i = 0; i < trail.length; i++) {
      const t = trail[i];
      t.age += dt;
      const show = sn && t.age < 12;
      t.mesh.visible = show;
      if (show) {
        trailMat[i].opacity = 0.9 * (1 - t.age / 12);
      }
    }
    const aw = $("arrowWrap");
    aw.style.display = sn ? "block" : "none";
    if (sn) {
      const dx = bun.pos.x - D.pos.x, dz = bun.pos.z - D.pos.z;
      const lx = dx * f.rx + dz * f.rz, lf = dx * f.fx + dz * f.fz;
      aw.style.transform = "rotate(" + Math.atan2(lx, lf) + "rad)";
    }

    const s = Math.ceil(timeLeft);
    setText("tTime", Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"));
    setText("tScore", "Score " + score);
    setText("tLicks", "Licks " + licks);
    $("stamFill").style.width = (D.stam * 100).toFixed(0) + "%";
  } else {
    const a = elapsed * 0.15;
    camera.position.set(Math.sin(a) * 6, 1.6, Math.cos(a) * 6 - 16);
    camera.lookAt(0, 0.5, -16);
    bun.hopT += dt * 4;
    bunMesh.outer.position.set(0, 0, -16);
    bunMesh.outer.rotation.y = elapsed * 0.5;
    bunMesh.inner.position.y = Math.abs(Math.sin(bun.hopT)) * 0.15;
    if (rag && state === "over") {
      renderPerson();
    }
  }

  lickT = Math.max(0, lickT - dt);
  for (const h of hearts) {
    if (h.life > 0) {
      h.life -= dt;
      h.v.y -= 6 * dt;
      h.m.position.addScaledVector(h.v, dt);
      h.m.visible = h.life > 0;
    }
  }

  inp.lookX = inp.lookY = 0;
  inp.jumpQ = inp.lickQ = false;
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

resetBun();
placeDog();
buildPerson();
showMenu(false);
frame();
})();
</script>
</body>
</html>
