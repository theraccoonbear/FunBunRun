<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>Fun Bun Run</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #87c5ea;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #fff;
        text-shadow: 0 2px 3px rgba(0, 0, 0, 0.55);
        z-index: 5;
      }
      #top {
        position: absolute;
        top: 10px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 18px;
        font-weight: 800;
        font-size: 18px;
      }
      #stam {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        width: 160px;
        height: 8px;
        background: rgba(0, 0, 0, 0.35);
        border-radius: 4px;
        overflow: hidden;
      }
      #stamFill {
        height: 100%;
        width: 100%;
        background: #ffd34d;
      }
      #arrowWrap {
        position: absolute;
        top: 58px;
        left: 50%;
        width: 40px;
        height: 40px;
        margin-left: -20px;
        display: none;
      }
      #arrow {
        width: 0;
        height: 0;
        margin: 3px auto 0;
        border-left: 12px solid transparent;
        border-right: 12px solid transparent;
        border-bottom: 30px solid #ff7ad9;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.5));
      }
      #hint {
        position: absolute;
        top: 22%;
        left: 0;
        right: 0;
        text-align: center;
        font-weight: 800;
        font-size: 22px;
        color: #ffd1f0;
        opacity: 0;
      }
      #hint.on {
        opacity: 1;
      }
      #pop {
        position: absolute;
        top: 30%;
        left: 0;
        right: 0;
        text-align: center;
        font-weight: 900;
        font-size: 34px;
        opacity: 0;
      }
      #pop.go {
        animation: pop 1.1s ease-out;
      }
      @keyframes pop {
        0% {
          opacity: 0;
          transform: scale(0.6);
        }
        15% {
          opacity: 1;
          transform: scale(1.15);
        }
        30% {
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-40px);
        }
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(30, 20, 50, 0.55);
        z-index: 10;
      }
      #card {
        background: #fff8ef;
        color: #3a2a1a;
        border-radius: 18px;
        padding: 22px 26px;
        max-width: 420px;
        width: 86%;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      #card h1 {
        margin: 0 0 4px;
        font-size: 36px;
        color: #c2477f;
        letter-spacing: 0.5px;
      }
      #card p {
        margin: 6px 0;
        line-height: 1.4;
      }
      #card .ctl {
        font-size: 14px;
        text-align: left;
        background: #f3e6d6;
        border-radius: 10px;
        padding: 8px 12px;
        margin: 12px 0;
      }
      #card button {
        font: inherit;
        font-weight: 800;
        font-size: 20px;
        background: #c2477f;
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 28px;
        margin-top: 6px;
        cursor: pointer;
      }
      #bMute,
      #sndHint {
        position: absolute;
        right: 10px;
        border: 2px solid rgba(255, 255, 255, 0.55);
        background: rgba(0, 0, 0, 0.25);
        color: #fff;
        font: inherit;
        font-weight: 800;
        pointer-events: auto;
        cursor: pointer;
      }
      #bMute {
        top: 8px;
        height: 36px;
        min-width: 56px;
        border-radius: 18px;
        font-size: 14px;
      }
      #sndHint {
        top: 52px;
        display: none;
        border-radius: 14px;
        padding: 6px 12px;
        font-size: 14px;
        background: rgba(194, 71, 127, 0.85);
      }
      #touch {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: none;
        touch-action: none;
      }
      #joyBase {
        position: fixed;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        border: 2px solid rgba(255, 255, 255, 0.4);
        display: none;
        pointer-events: none;
        z-index: 3;
      }
      #joyKnob {
        position: absolute;
        left: 35px;
        top: 35px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
      }
      #joyKnob.sprint {
        background: #ffd34d;
      }
      .btn {
        position: fixed;
        z-index: 4;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.25);
        border: 2px solid rgba(255, 255, 255, 0.55);
        color: #fff;
        font-weight: 900;
        display: none;
        align-items: center;
        justify-content: center;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        touch-action: none;
      }
      #bLick {
        right: 24px;
        bottom: 40px;
        width: 96px;
        height: 96px;
        font-size: 20px;
        background: rgba(255, 95, 200, 0.45);
      }
      #bLick.hot {
        background: rgba(255, 95, 200, 0.85);
        box-shadow: 0 0 18px #ff5fc8;
      }
      #bJump {
        right: 132px;
        bottom: 28px;
        width: 68px;
        height: 68px;
        font-size: 14px;
      }
      #bSniff {
        right: 40px;
        bottom: 150px;
        width: 68px;
        height: 68px;
        font-size: 14px;
      }
      .btn.down {
        background: rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="top">
        <span id="tTime">1:30</span><span id="tScore">Score 0</span><span id="tLicks">Licks 0</span>
      </div>
      <div id="stam"><div id="stamFill"></div></div>
      <div id="arrowWrap"><div id="arrow"></div></div>
      <div id="hint">LICK!</div>
      <div id="pop"></div>
      <button id="bMute" type="button" tabindex="-1" aria-pressed="false">&#9834; on</button>
      <button id="sndHint" type="button" tabindex="-1">Tap for sound</button>
    </div>
    <div id="touch"></div>
    <div id="joyBase"><div id="joyKnob"></div></div>
    <div class="btn" id="bLick">LICK</div>
    <div class="btn" id="bJump">JUMP</div>
    <div class="btn" id="bSniff">SNIFF</div>
    <div id="overlay"><div id="card"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
