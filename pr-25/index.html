    <style>html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;background:#87c5ea;height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}canvas{touch-action:none;display:block}#hud{pointer-events:none;color:#fff;text-shadow:0 2px 3px #0000008c;z-index:5;position:fixed;inset:0}#top{justify-content:center;gap:18px;font-size:18px;font-weight:800;display:flex;position:absolute;top:10px;left:0;right:0}#stam{background:#00000059;border-radius:4px;width:160px;height:8px;position:absolute;top:40px;left:50%;overflow:hidden;transform:translate(-50%)}#stamFill{background:#ffd34d;width:100%;height:100%}#arrowWrap{width:40px;height:40px;margin-left:-20px;display:none;position:absolute;top:58px;left:50%}#arrow{filter:drop-shadow(0 2px 2px #00000080);border-bottom:30px solid #ff7ad9;border-left:12px solid #0000;border-right:12px solid #0000;width:0;height:0;margin:3px auto 0}#hint{text-align:center;color:#ffd1f0;opacity:0;font-size:22px;font-weight:800;position:absolute;top:22%;left:0;right:0}#hint.on{opacity:1}#pop{text-align:center;opacity:0;font-size:34px;font-weight:900;position:absolute;top:30%;left:0;right:0}#pop.go{animation:1.1s ease-out pop}@keyframes pop{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}to{opacity:0;transform:translateY(-40px)}}#overlay{z-index:10;background:#1e14328c;justify-content:center;align-items:center;display:flex;position:fixed;inset:0}#card{color:#3a2a1a;text-align:center;background:#fff8ef;border-radius:18px;width:86%;max-width:420px;padding:22px 26px;box-shadow:0 10px 30px #00000059}#card h1{color:#c2477f;letter-spacing:.5px;margin:0 0 4px;font-size:36px}#card p{margin:6px 0;line-height:1.4}#card .ctl{text-align:left;background:#f3e6d6;border-radius:10px;margin:12px 0;padding:8px 12px;font-size:14px}#card button{font:inherit;color:#fff;cursor:pointer;background:#c2477f;border:0;border-radius:12px;margin-top:6px;padding:12px 28px;font-size:20px;font-weight:800}#touch{z-index:2;touch-action:none;display:none;position:fixed;inset:0}#joyBase{pointer-events:none;z-index:3;background:#ffffff2e;border:2px solid #fff6;border-radius:50%;width:120px;height:120px;display:none;position:fixed}#joyKnob{background:#fff9;border-radius:50%;width:50px;height:50px;position:absolute;top:35px;left:35px}#joyKnob.sprint{background:#ffd34d}.btn{z-index:4;color:#fff;text-shadow:0 1px 2px #0009;touch-action:none;background:#ffffff40;border:2px solid #ffffff8c;border-radius:50%;justify-content:center;align-items:center;font-weight:900;display:none;position:fixed}#bLick{background:#ff5fc873;width:96px;height:96px;font-size:20px;bottom:40px;right:24px}#bLick.hot{background:#ff5fc8d9;box-shadow:0 0 18px #ff5fc8}#bJump{width:68px;height:68px;font-size:14px;bottom:28px;right:132px}#bSniff{width:68px;height:68px;font-size:14px;bottom:150px;right:40px}.btn.down{background:#ffffff80}</style>
